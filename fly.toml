# fly.toml app configuration file generated for design-portfolio-server on 2025-02-12T13:37:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'design-portfolio-server'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
